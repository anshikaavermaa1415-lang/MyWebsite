<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COURSES</title>
    <style>
    body {
    background-color: lightblue;
    font-family: Arial, sans-serif;
    margin: 0;
    text-align: center;
}

header {
    padding: 20px;
}

h1 {
    color: blue;
    font-size: 32px;
}

main {
    display: flex; 
    justify-content: center;
    gap: 25px;
    padding: 30px;
}

.card {
    background-color: white;
    width: 250px;
    padding: 20px;
    border-radius: 10px;
}

.card h2 {
    color: blue;
    font-size: 24px;
}

.card p {
    color: black;
    font-size: 14px;
}

.button {
    display: inline-block;
    background-color: blue;
    color: white;
    text-decoration: none;
    padding: 10px ;
    border-radius: 5px;
    font-size: 14px;
}

.button:hover {
    background-color: darkblue;
}

footer {
    color: black;
    font-size: 14px;
    padding: 20px;
    text-decoration: underline;
}
</style>
</head>
<body>
    <header>
    <h1>MY COURSES</h1>
    </header>
    <main>

    <div class="card">
        <h2>HTML</h2>
        <p>Learn basics of HTML and create your first webpage</p>
        <a href="html-course.html" class="button">Start Course</a>
    </div>

    <div class="card">
        <h2>CSS</h2>
        <p>Learn color, fonts, borders and beautiful webpage styling</p>
        <a href="css-course.html" class="button">Start Course</a>
    </div>

    <div class="card">
        <h2>JavaScript</h2>
        <p>Learn JavaScript and make your webpage interactive</p>
        <a href="javascript-course.html" class="button">Start Course</a>
    </div>

</main>
    <footer>
      <a href="learn-web-development.html">Learn Web Development</a>
    </footer>


</body>
</html>
